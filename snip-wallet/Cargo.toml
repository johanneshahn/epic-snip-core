[package]
name = "epic_snip_wallet"
version = "4.1.2"
authors = ["Epic Foundation <info@epiccash.com>"]
description = "Reusable, recoverable SNIP wallet primitives for the Usernet research prototype."
license = "Apache-2.0"
edition = "2021"
workspace = ".."

[dependencies]
epic_core = { path = "../core", version = "4.1.2" }
epic_keychain = { path = "../keychain", version = "4.1.2" }
epic_util = { path = "../util", version = "4.1.2" }
fs2 = "0.4"
serde = "1"
serde_derive = "1.0"
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"

[dev-dependencies]
tempfile = "3.0"
